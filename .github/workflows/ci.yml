name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }}, Rust ${{ matrix.toolchain }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
          - os: ubuntu-latest
            toolchain: 1.96.0
          - os: macos-latest
            toolchain: stable
          - os: windows-latest
            toolchain: stable
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchains and nextest
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install '${{ matrix.toolchain }}' --profile minimal
          cargo +stable install cargo-nextest --locked --version 0.9.140
      - name: Test all targets
        run: cargo +${{ matrix.toolchain }} nextest run --all-targets --all-features --locked
      - name: Test documentation
        run: cargo +${{ matrix.toolchain }} test --doc --all-features --locked
      - name: Run examples
        run: |
          for example in sharing signing refresh identifiable_abort transport; do
            cargo +${{ matrix.toolchain }} run --locked --example "$example"
          done
          cargo +${{ matrix.toolchain }} run --locked --features experimental-dkg --example dkg_projection
          cargo +${{ matrix.toolchain }} run --locked --features experimental-dkg --example dkg_contribution
          cargo +${{ matrix.toolchain }} run --locked --features experimental-dkg --example dkg
          cargo +${{ matrix.toolchain }} run --locked --features experimental-dkg --example dkg -- --uniform
          cargo +${{ matrix.toolchain }} run --locked --features experimental-dkg --example dkg_transport

  quality:
    name: Formatting, documentation, vectors, and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install checks
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools-preview
          cargo +stable install cargo-nextest --locked --version 0.9.140
          cargo +stable install cargo-llvm-cov --locked --version 0.8.7
      - run: cargo +stable fmt --all --check
      - run: cargo +stable fmt --manifest-path fuzz/Cargo.toml --all --check
      - run: cargo +stable check --all-targets --no-default-features --locked
      - run: cargo +stable clippy --all-targets --all-features --locked -- -D warnings
      - name: Build documentation without warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --no-deps --all-features --locked
      - name: Check independent reference vectors
        run: python3 scripts/check_vectors.py
      - name: Check the fixed-projection masking research model
        run: python3 scripts/dkg_masking_model.py
      - name: Check integer Gaussian distribution research models
        run: python3 scripts/dkg_distribution_model.py
      - name: Collect library coverage
        env:
          RUSTC_WRAPPER: ""
        run: cargo +stable llvm-cov nextest --all-targets --all-features --locked --lcov --output-path target/lcov.info --fail-under-lines 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: target/lcov.info
          if-no-files-found: error

  fuzz:
    name: Sanitizer fuzz smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fuzz toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly-2026-08-29 --profile minimal
          cargo +stable install cargo-fuzz --locked --version 0.12.0
      - run: cargo +nightly-2026-08-29 fetch --manifest-path fuzz/Cargo.toml --locked
      - run: python3 scripts/fuzz_seeds.py
      - name: Fuzz wire messages
        run: cargo +nightly-2026-08-29 fuzz run wire_messages -- -max_total_time=60 -max_len=4096 -rss_limit_mb=1024
      - name: Fuzz DKG messages
        run: cargo +nightly-2026-08-29 fuzz run dkg_messages -- -max_total_time=60 -max_len=16387 -rss_limit_mb=1024
      - name: Fuzz ring arithmetic
        run: cargo +nightly-2026-08-29 fuzz run ring_differential -- -max_total_time=60 -max_len=513 -rss_limit_mb=1024
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
